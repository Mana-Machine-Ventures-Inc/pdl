[package]
name = "pdl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for pdl-core bake (Playground portable demo path)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
pdl-core = { path = "../pdl-core" }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
js-sys = "0.3"
